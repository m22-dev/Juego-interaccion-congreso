<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rastreador de Brazos y Puños</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #app {
      width: 100vw;
      height: 100vh;
    }
    #app canvas {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Background music: "Winter Fun (short ver.)" by AudioCoffee (CC BY-NC 4.0)
       https://freesound.org/people/AudioCoffee/sounds/717284/ -->
  <audio id="bgm" src="https://cdn.freesound.org/previews/717/717284_15232790-hq.mp3" loop preload="auto"></audio>
  <script>
    (function () {
      const bgm = document.getElementById("bgm");
      function tryPlay() {
        const p = bgm.play();
        if (p && p.catch) p.catch(() => {});
      }
      // Try right away (some browsers allow it once a permission prompt is granted).
      tryPlay();
      // Fallback: browsers block audible autoplay until the first user gesture.
      const events = ["pointerdown", "keydown", "touchstart"];
      function onGesture() {
        tryPlay();
        events.forEach((e) => window.removeEventListener(e, onGesture));
      }
      events.forEach((e) => window.addEventListener(e, onGesture));
    })();
  </script>

  <script src="interaccion.js"></script>
</body>
</html>
